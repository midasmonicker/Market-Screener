name: Daily Stock Screener

'on':
  schedule:
    # Run at 22:30 UTC (5:30 PM EST / 6:30 PM EDT) Monday through Friday
    - cron: '30 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore SQLite DB from orphan data branch
        run: |
          # Fetch the data branch if it exists, and extract backend/stock_screener.db
          if git ls-remote --exit-code --heads origin data; then
            echo "Found existing 'data' branch. Checking out stock_screener.db..."
            git fetch origin data
            git checkout origin/data -- backend/stock_screener.db || true
          else
            echo "No 'data' branch found yet. Starting with clean or repository DB."
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pandas-ta --no-deps

      - name: Run daily screener
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd backend && python run_daily.py

      - name: Commit and push web data to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/
          if git diff --staged --quiet; then
            echo "No web data changes to commit to main."
          else
            git commit -m "chore: automated daily web data update [skip ci]"
            git push origin main
          fi

      - name: Persist SQLite DB as single commit on orphan data branch
        if: success()
        run: |
          if [ -f "backend/stock_screener.db" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # Create a separate clean orphan branch with only stock_screener.db
            git checkout --orphan data-temp
            git rm -rf . --quiet || true
            cp backend/stock_screener.db stock_screener.db
            git add stock_screener.db
            git commit -m "chore: persistent database snapshot [skip ci]"
            # Force-push as single commit to 'data' branch so Git history never accumulates
            git push -f origin data-temp:data
          fi
