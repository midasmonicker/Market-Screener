name: Daily Stock Screener

'on':
  schedule:
    # Checkpoints: paired UTC times cover EST/EDT; the off-season companion exits before DB restore.
    - cron: '0 15 * * 1-5'
    - cron: '0 16 * * 1-5'
    - cron: '0 17 * * 1-5'
    - cron: '0 18 * * 1-5'
    - cron: '30 19 * * 1-5'
    - cron: '30 20 * * 1-5'
    # EOD run at 22:30 UTC (after the NYSE close in both EST and EDT).
    - cron: '30 22 * * 1-5'
  workflow_dispatch:
    inputs:
      checkpoint_id:
        description: >-
          Explicit intraday checkpoint to run, fired by the external
          scheduler at the real NY-local checkpoint time (GitHub
          deprioritizes `schedule` events, which were observed firing
          hours late -- workflow_dispatch runs promptly). Leave blank
          for a manual EOD run.
        required: false
        type: choice
        default: ''
        options:
          - ''
          - intraday_11am
          - intraday_1pm
          - intraday_330pm

permissions:
  contents: write

concurrency:
  group: market-screener-pipeline
  cancel-in-progress: false

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Select EOD or intraday run
        id: run-mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_CHECKPOINT_ID: ${{ github.event.inputs.checkpoint_id }}
        run: |
          # Primary checkpoint trigger: an external scheduler calling the
          # workflow_dispatch API at the real NY-local checkpoint time with
          # an explicit checkpoint_id. workflow_dispatch events run promptly
          # (unlike `schedule` events, which GitHub deprioritizes and which
          # this pipeline observed firing 3-4 hours late), so no wall-clock
          # re-check is needed here beyond the one run_daily.py already does.
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$DISPATCH_CHECKPOINT_ID" ]]; then
            echo "mode=checkpoint" >> "$GITHUB_OUTPUT"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "checkpoint_id=$DISPATCH_CHECKPOINT_ID" >> "$GITHUB_OUTPUT"
            echo "Explicit checkpoint dispatch received: $DISPATCH_CHECKPOINT_ID"
            exit 0
          fi

          if [[ "$EVENT_NAME" != "schedule" || "$EVENT_SCHEDULE" == "30 22 * * 1-5" ]]; then
            echo "mode=eod" >> "$GITHUB_OUTPUT"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fallback path only: the legacy UTC checkpoint crons below are a
          # dead-man's-switch in case the external scheduler ever misses a
          # fire. They are NOT the primary checkpoint trigger and are known
          # to be unreliable for precise timing on this platform.
          read -r hour minute <<< "$(TZ=America/New_York date '+%H %M')"
          current_minutes=$((10#$hour * 60 + 10#$minute))
          should_run=false
          for target_minutes in 660 780 930; do
            difference=$((current_minutes - target_minutes))
            if (( difference >= 0 && difference <= 5 )); then
              should_run=true
              break
            fi
          done
          echo "mode=checkpoint" >> "$GITHUB_OUTPUT"
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "checkpoint_id=auto" >> "$GITHUB_OUTPUT"
          if [[ "$should_run" == "false" ]]; then
            echo "This is the non-DST companion cron; no checkpoint is due in New York local time."
          fi

      - name: Restore SQLite DB from orphan data branch
        if: steps.run-mode.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          restore_tmp="$(mktemp backend/stock_screener.db.restore.XXXXXX)"
          trap 'rm -f "$restore_tmp"' EXIT
          # Fetch the data branch if it exists, and extract backend/stock_screener.db
          if git ls-remote --exit-code --heads origin data; then
            echo "Found existing 'data' branch. Restoring the database snapshot..."
            git fetch origin data
            if git cat-file -e origin/data:stock_screener.db 2>/dev/null; then
              git show origin/data:stock_screener.db > "$restore_tmp"
            elif git cat-file -e origin/data:backend/stock_screener.db 2>/dev/null; then
              git show origin/data:backend/stock_screener.db > "$restore_tmp"
            else
              parts=$(git ls-tree -r --name-only origin/data | grep -E '^stock_screener\.db\.gz\.part-[0-9]+$' || true)
              if [[ -n "$parts" ]]; then
                while IFS= read -r part; do
                  git show "origin/data:$part"
                done <<< "$parts" | gzip -dc > "$restore_tmp"
              else
                echo "No recognized database snapshot found; the seed step will initialize it."
              fi
            fi
            if [[ -s "$restore_tmp" ]]; then
              mv "$restore_tmp" backend/stock_screener.db
              echo "Database snapshot restored atomically."
            fi
          else
            echo "No 'data' branch found yet. Starting with clean or repository DB."
          fi

      - name: Set up Python 3.12
        if: steps.run-mode.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        if: steps.run-mode.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pandas-ta --no-deps

      - name: Verify restored SQLite database
        if: steps.run-mode.outputs.should_run == 'true'
        run: |
          if [[ -f backend/stock_screener.db ]]; then
            python - <<'PY'
          import sqlite3

          connection = sqlite3.connect("backend/stock_screener.db")
          try:
              result = connection.execute("PRAGMA integrity_check").fetchone()[0]
              if result != "ok":
                  raise RuntimeError(f"Restored SQLite database is invalid: {result}")
              print("Restored SQLite database integrity: ok")
          finally:
              connection.close()
          PY
          fi

      - name: Restore Finnhub earnings cache
        if: steps.run-mode.outputs.should_run == 'true' && steps.run-mode.outputs.mode == 'eod'
        uses: actions/cache@v4
        with:
          path: backend/.cache
          key: earnings-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            earnings-cache-${{ runner.os }}-

      - name: Seed rolling history when needed
        if: steps.run-mode.outputs.should_run == 'true' && steps.run-mode.outputs.mode == 'eod'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          cd backend && python seed_history.py --trading-days 200

      - name: Run daily screener
        if: steps.run-mode.outputs.should_run == 'true' && steps.run-mode.outputs.mode == 'eod'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd backend && python run_daily.py

      - name: Run intraday checkpoint
        if: steps.run-mode.outputs.should_run == 'true' && steps.run-mode.outputs.mode == 'checkpoint'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: |
          cd backend && python run_daily.py --checkpoint "${{ steps.run-mode.outputs.checkpoint_id }}"

      - name: Validate generated web data
        if: steps.run-mode.outputs.should_run == 'true'
        run: node frontend/scripts/validate-data-json.mjs

      - name: Commit and push web data to main
        if: steps.run-mode.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/
          if git diff --staged --quiet; then
            echo "No web data changes to commit to main."
          else
            git commit -m "chore: automated daily web data update [skip ci]"
            git push origin main
          fi

      - name: Persist compressed SQLite DB on orphan data branch
        if: success() && steps.run-mode.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          if [ -f "backend/stock_screener.db" ]; then
            python - <<'PY'
          import sqlite3

          connection = sqlite3.connect("backend/stock_screener.db")
          try:
              result = connection.execute("PRAGMA integrity_check").fetchone()[0]
              if result != "ok":
                  raise RuntimeError(f"Refusing to persist invalid SQLite database: {result}")
          finally:
              connection.close()
          PY
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # Create a separate clean orphan branch with only stock_screener.db
            git checkout --orphan data-temp
            git rm -rf . --quiet || true
            gzip -1 -c backend/stock_screener.db | split -b 90m -d -a 3 - stock_screener.db.gz.part-
            git add stock_screener.db.gz.part-*
            git commit -m "chore: compressed database snapshot [skip ci]"
            # Force-push as single commit to 'data' branch so Git history never accumulates
            git push -f origin data-temp:data
          fi
